<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · e-Ballot</title>
  <meta name="description" content="Online ballot for university batch representative elections.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/ballot.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="wordmark" data-home href="index.html">e-<span>Ballot</span></a>

    </div>
  </header>
  <main id="main">
    <h1>Batch representative elections</h1>
    <p class="lede">Sign in with your roll number to see the candidates standing for your batch and cast your ballot. Each voter gets one ballot, and only for their own batch.</p>
    <div class="split">
      <section class="sheet" aria-labelledby="signin-title">
        <h2 id="signin-title">Sign in</h2>
        <form id="signin-form" novalidate>
          <label>Roll number
            <input name="roll_number" autocomplete="username" required class="mono" placeholder="22F-1004">
          </label>
          <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Sign in</button>
          <p class="notice" id="signin-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="sheet" aria-labelledby="register-title">
        <h2 id="register-title">Register to vote</h2>
        <form id="register-form" novalidate>
          <label>Full name
            <input name="username" autocomplete="name" required maxlength="60">
          </label>
          <div class="row">
            <label>Roll number
              <input name="roll_number" required class="mono" maxlength="20" pattern="[A-Za-z0-9-]+">
            </label>
            <label>Batch (intake year)
              <input name="batch" type="number" inputmode="numeric" min="1" max="9999" required>
            </label>
          </div>
          <label>Password <span class="hint">at least 8 characters</span>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button type="submit" class="button--ghost">Create account</button>
          <p class="notice" id="register-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
